version: '3.8'

services:
  gopower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopower-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/gopower.db
    volumes:
      - gopower-data:/app/data
    restart: unless-stopped

volumes:
  gopower-data: