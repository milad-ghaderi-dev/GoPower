name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Verify code (go vet)
      run: go vet ./...

    - name: Run unit & integration tests with Race Detector
      run: go test -v -race ./...

    - name: Build binary
      run: go build -v -o bin/gopower ./cmd/server